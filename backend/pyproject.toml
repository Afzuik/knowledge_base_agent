[project]
name = "knowledge-workbench-backend"
version = "0.2.0"
description = "Local single-user document ingestion workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
